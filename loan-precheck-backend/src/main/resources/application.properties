## App Config
spring.application.name=loan-precheck-backend
server.port=${PORT:8080}
spring.devtools.restart.enabled=true
logging.level.root=INFO
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

## H2 web console
# Enabled here for local dev and for anyone cloning the repo to try it out.
# Disabled in the deployed Render environment via SPRING_H2_CONSOLE_ENABLED=false,
# since exposing the H2 console publicly is a real attack surface.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Database Connection (In-Memory)
# Data resets on every restart since H2 runs in-memory instead of persisting to disk.
spring.datasource.url=jdbc:h2:mem:precheckdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

## Tell Spring to auto-create tables based on Java models
spring.jpa.hibernate.ddl-auto=update